<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Knight Adventures - Official Download</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #060913;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 242, 254, 0.15), transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(245, 175, 25, 0.1), transparent 50%);
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            background: rgba(13, 19, 33, 0.7);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 24px;
            padding: 40px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00f2fe 0%, #ffffff 50%, #f5af19 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .sub-text {
            color: #a0aec0;
            font-size: 1.1rem;
            margin-bottom: 35px;
        }

        /* زر التحميل المباشر */
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 45px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #060913;
            font-weight: 800;
            font-size: 1.25rem;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .download-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.8);
            background: linear-gradient(135deg, #38ef7d 0%, #11998e 100%);
        }

        .download-btn svg {
            width: 26px;
            height: 26px;
            stroke-width: 2.5;
        }

        .file-info {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #718096;
        }

        .file-info span {
            color: #00f2fe;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- اسم اللعبة -->
        <h1 class="game-title">Space Knight Adventures</h1>
        
        <!-- الرسالة التوضيحية -->
        <p class="sub-text">To download the game, click the button below</p>
        
        <!-- زر التحميل المباشر لملف اللعبة .exe -->
        <a href="Space_Knight_Adventures.exe" download="Space_Knight_Adventures.exe" class="download-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>DOWNLOAD GAME NOW</span>
        </a>

        <!-- معلومات الملف -->
        <div class="file-info">
            File Version: <span>v1.0.4</span> | Format: <span>.EXE</span>
        </div>
    </div>

</body>
</html>
